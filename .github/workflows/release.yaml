name: release

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build, such as v1.2.3
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build again, such as v1.2.3
        required: true
        type: string

permissions: {}

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    env:
      IMAGE: ghcr.io/preburn/preburn
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Read versions.env
        id: versions
        run: cat versions.env >> "$GITHUB_OUTPUT"
      - name: Derive the image tags from the release tag
        id: release
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "tag is not a release version tag=${RELEASE_TAG}" >&2
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          major_minor="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          tag_commit="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          main_commit="$(git rev-parse --verify refs/remotes/origin/main)"
          {
            echo "version=${version}"
            echo "commit=${tag_commit}"
            echo "build-date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "tags<<TAGS"
            echo "${IMAGE}:${version}"
            echo "${IMAGE}:${major_minor}"
            if git merge-base --is-ancestor "${tag_commit}" "${main_commit}"; then
              echo "${IMAGE}:latest"
            else
              echo "tag is not on main, latest is not moved tag=${RELEASE_TAG}" >&2
            fi
            echo "TAGS"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Sign in to GHCR
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin <<< "${GITHUB_TOKEN}"
      - name: Build and push the image for amd64 and arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          # The default Git context builds github.sha, which is not always the tag's commit.
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.release.outputs.tags }}
          sbom: true
          provenance: mode=max
          build-args: |
            NODE_IMAGE=${{ steps.versions.outputs.NODE_IMAGE }}
            GO_IMAGE=${{ steps.versions.outputs.GO_IMAGE }}
            RUNTIME_IMAGE=${{ steps.versions.outputs.RUNTIME_IMAGE }}
            PNPM_VERSION=${{ steps.versions.outputs.PNPM_VERSION }}
            VERSION=${{ steps.release.outputs.version }}
            COMMIT=${{ steps.release.outputs.commit }}
            BUILD_DATE=${{ steps.release.outputs.build-date }}
      - name: Attach the OpenAPI document to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${RELEASE_TAG}" api/openapi.json --clobber --repo "${GITHUB_REPOSITORY}"
