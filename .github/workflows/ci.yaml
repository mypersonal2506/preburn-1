name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  versions:
    runs-on: ubuntu-24.04
    outputs:
      go-version: ${{ steps.read.outputs.GO_VERSION }}
      go-image: ${{ steps.read.outputs.GO_IMAGE }}
      node-version: ${{ steps.read.outputs.NODE_VERSION }}
      node-image: ${{ steps.read.outputs.NODE_IMAGE }}
      pnpm-version: ${{ steps.read.outputs.PNPM_VERSION }}
      golangci-lint-version: ${{ steps.read.outputs.GOLANGCI_LINT_VERSION }}
      gitleaks-image: ${{ steps.read.outputs.GITLEAKS_IMAGE }}
      runtime-image: ${{ steps.read.outputs.RUNTIME_IMAGE }}
      postgres-image: ${{ steps.read.outputs.POSTGRES_IMAGE }}
      valkey-image: ${{ steps.read.outputs.VALKEY_IMAGE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read versions.env
        id: read
        run: cat versions.env >> "$GITHUB_OUTPUT"
      - name: Check the compose.yaml image tags against versions.env
        run: scripts/check-image-tags.sh

  go:
    needs: versions
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: ${{ needs.versions.outputs.postgres-image }}
        env:
          POSTGRES_USER: preburn
          POSTGRES_PASSWORD: preburn
          POSTGRES_INITDB_ARGS: -c max_connections=200
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=preburn --dbname=preburn"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      valkey:
        image: ${{ needs.versions.outputs.valkey-image }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      PREBURN_TEST_DATABASE_URL: postgres://preburn:preburn@localhost:5432/preburn?sslmode=disable
      PREBURN_TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the leak guard
        run: scripts/test-check-private-names.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ needs.versions.outputs.go-version }}
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v${{ needs.versions.outputs.golangci-lint-version }}
      - run: go test -race ./...

  web:
    needs: versions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ needs.versions.outputs.node-version }}
      - name: Install pnpm
        env:
          PNPM_VERSION: ${{ needs.versions.outputs.pnpm-version }}
        run: |
          corepack enable pnpm
          corepack install --global "pnpm@${PNPM_VERSION}"
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web exec biome ci
      - run: pnpm --dir web run typecheck
      - run: pnpm --dir web run test
      - run: pnpm --dir web run check-copy
      - run: pnpm --dir web run build
      - run: pnpm --dir web run check-bundle
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ needs.versions.outputs.go-version }}
      - name: Test the embedded dashboard build
        run: go test -tags embedweb ./web/...

  generated:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Match the tools image user to the runner user
        run: |
          {
            echo "USER_ID=$(id -u)"
            echo "GROUP_ID=$(id -g)"
          } >> "$GITHUB_ENV"
      - run: make tools
      - run: make generate
      - name: Fail when generated files differ from their sources
        run: |
          git add --all
          git diff --cached --exit-code

  docker:
    needs: versions
    runs-on: ubuntu-24.04
    env:
      VERSION: ci
      COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Stamp the build date
        run: echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image for amd64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: preburn:local
          build-args: |
            NODE_IMAGE=${{ needs.versions.outputs.node-image }}
            GO_IMAGE=${{ needs.versions.outputs.go-image }}
            RUNTIME_IMAGE=${{ needs.versions.outputs.runtime-image }}
            PNPM_VERSION=${{ needs.versions.outputs.pnpm-version }}
            VERSION=${{ env.VERSION }}
            COMMIT=${{ env.COMMIT }}
            BUILD_DATE=${{ env.BUILD_DATE }}
          cache-from: type=gha,scope=image
          cache-to: type=gha,scope=image,mode=max
      - name: Check the image
        run: scripts/test-image.sh
      - name: Save the image
        run: docker save --output "${RUNNER_TEMP}/preburn-image.tar" preburn:local
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preburn-image
          path: ${{ runner.temp }}/preburn-image.tar
          if-no-files-found: error
          retention-days: 1

  smoke:
    needs: docker
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: preburn-image
          path: ${{ runner.temp }}
      - name: Load the image
        run: docker load --input "${RUNNER_TEMP}/preburn-image.tar"
      - run: make smoke

  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: preburn/sdk-python
          path: sdk-python
          persist-credentials: false
      - name: Read the SDK versions.env
        id: sdk
        run: cat sdk-python/versions.env >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ steps.sdk.outputs.UV_VERSION }}
          checksum: ${{ steps.sdk.outputs.UV_SHA256_AMD64 }}
      - name: Run the SDK contract tests against this api/openapi.json
        env:
          PREBURN_OPENAPI_PATH: ${{ github.workspace }}/api/openapi.json
        run: make --directory sdk-python test-contract

  secrets:
    needs: versions
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_IMAGE: ${{ needs.versions.outputs.gitleaks-image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan the full history
        if: github.event_name != 'pull_request'
        run: >-
          docker run --rm --volume "$PWD:/repository" "$GITLEAKS_IMAGE"
          git --config /repository/.gitleaks.toml --no-banner --redact --verbose
          /repository
      - name: Scan the pull request commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          docker run --rm --volume "$PWD:/repository" "$GITLEAKS_IMAGE"
          git --config /repository/.gitleaks.toml --no-banner --redact --verbose
          --log-opts "${BASE_SHA}..${HEAD_SHA}" /repository

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check Signed-off-by trailers
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/check-dco.sh "$BASE_SHA" "$HEAD_SHA"
