name: preburn-test

services:
  postgres:
    image: ${POSTGRES_IMAGE:?}
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_USER: preburn
      POSTGRES_PASSWORD: preburn
    ports:
      - "127.0.0.1:35432:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "--username=preburn", "--dbname=preburn"]
      interval: 2s
      timeout: 5s
      retries: 30

  valkey:
    image: ${VALKEY_IMAGE:?}
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:36379:6379"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  tools:
    image: preburn-tools:local
    build:
      context: docker
      dockerfile: tools.Dockerfile
      args:
        GO_VERSION: ${GO_VERSION:?}
        NODE_VERSION: ${NODE_VERSION:?}
        NODE_SHA256_AMD64: ${NODE_SHA256_AMD64:?}
        NODE_SHA256_ARM64: ${NODE_SHA256_ARM64:?}
        PNPM_VERSION: ${PNPM_VERSION:?}
        SQLC_VERSION: ${SQLC_VERSION:?}
        SQLC_SHA256_AMD64: ${SQLC_SHA256_AMD64:?}
        SQLC_SHA256_ARM64: ${SQLC_SHA256_ARM64:?}
        GOLANGCI_LINT_VERSION: ${GOLANGCI_LINT_VERSION:?}
        GOLANGCI_LINT_SHA256_AMD64: ${GOLANGCI_LINT_SHA256_AMD64:?}
        GOLANGCI_LINT_SHA256_ARM64: ${GOLANGCI_LINT_SHA256_ARM64:?}
        GITLEAKS_VERSION: ${GITLEAKS_VERSION:?}
        GITLEAKS_SHA256_AMD64: ${GITLEAKS_SHA256_AMD64:?}
        GITLEAKS_SHA256_ARM64: ${GITLEAKS_SHA256_ARM64:?}
        ACTIONLINT_VERSION: ${ACTIONLINT_VERSION:?}
        ACTIONLINT_SHA256_AMD64: ${ACTIONLINT_SHA256_AMD64:?}
        ACTIONLINT_SHA256_ARM64: ${ACTIONLINT_SHA256_ARM64:?}
        GOIMPORTS_VERSION: ${GOIMPORTS_VERSION:?}
        USER_ID:
        GROUP_ID:
    profiles: ["tools"]
    ulimits:
      core: 0
    volumes:
      - .:/workspace
      - go-module-cache:/go/pkg/mod
      - go-build-cache:/home/preburn/.cache/go-build
      - golangci-lint-cache:/home/preburn/.cache/golangci-lint
      - pnpm-store:/home/preburn/.local/share/pnpm/store
    environment:
      PREBURN_TEST_DATABASE_URL: postgres://preburn:preburn@postgres:5432/preburn?sslmode=disable
      PREBURN_TEST_REDIS_URL: redis://valkey:6379
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /workspace
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

volumes:
  go-module-cache:
  go-build-cache:
  golangci-lint-cache:
  pnpm-store:
