version: "2"

linters:
  default: none
  enable:
    - bodyclose
    - contextcheck
    - errcheck
    - errorlint
    - exhaustive
    - forbidigo
    - gocritic
    - gosec
    - govet
    - ineffassign
    - misspell
    - nilerr
    - noctx
    - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unparam
    - unused
  settings:
    forbidigo:
      forbid:
        - pattern: ^fmt\.Print(f|ln)?$
          msg: write to an explicit writer, or log an event with slog
        - pattern: ^log\.Print(f|ln)?$
          msg: log an event with slog
      analyze-types: true
    revive:
      enable-default-rules: true
      rules:
        - name: exported
  exclusions:
    paths:
      - ^internal/[^/]+/queries/
    rules:
      - path: ^cmd/
        linters:
          - forbidigo

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/preburn/preburn
  exclusions:
    paths:
      - ^internal/[^/]+/queries/
