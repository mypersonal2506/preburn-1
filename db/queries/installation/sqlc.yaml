version: "2"
sql:
  - engine: postgresql
    schema: ../../migrations
    queries: .
    gen:
      go:
        package: queries
        out: ../../../internal/installation/queries
        sql_package: pgx/v5
        omit_unused_structs: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
